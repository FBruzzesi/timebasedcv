[build-system]
requires = ["uv_build>=0.11.0,<0.13.0"]
build-backend = "uv_build"

[project]
name = "timebasedcv"
version = "0.3.0"
description = "Time based cross validation"
authors = [{name = "Francesco Bruzzesi"}]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "python-dateutil",
    "numpy",
    "narwhals>=1.0.0",
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
documentation = "https://fbruzzesi.github.io/timebasedcv/"
repository = "https://github.com/fbruzzesi/timebasedcv"
issue-tracker = "https://github.com/fbruzzesi/timebasedcv/issues"

[project.optional-dependencies]
scikit-learn = ["scikit-learn>=0.19"]

[dependency-groups]
testing = [
    "covdefaults>=2.3.0",
    "dask>=2023.1.0",
    "pandas>=1.2.0",
    "polars>=0.20.3",
    "pyarrow>=11.0.0",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-xdist>=3.8.0",
]
docs = [
    "markdown-exec>=1.12.3",
    "mkdocstrings-python>=2.0.3",
    "zensical>=0.0.26",
]
typing = [
    "mypy>=1.19.1",
    "pandas-stubs>=2.3.3.260113",
    "pyarrow-stubs>=20.0.0.20251215",
    "pyrefly>=1.0.0",
    "pyright>=1.1.408",
    "types-python-dateutil>=2.9.0.20260305",
    "typing-extensions>=4.15.0",
    {include-group = "testing"},
]

dev = [
    "prek>=0.3.5",
    "ruff>=0.15.6",
    {include-group = "testing"},
    {include-group = "docs"},
    {include-group = "typing"},
]

[tool.uv.build-backend]
source-include = [
  "src/*",
  "tests/*",
]
wheel-include = [
  "src/*",
]

[tool.ruff]
line-length = 120
target-version = "py310"
fix = true

[tool.ruff.lint]
preview = true
explicit-preview-rules = true

select = ["ALL"]
ignore = [
  "CPY",
  "D100",  # Checks for undocumented public module definitions.
  "D104",  # Checks for undocumented public package definitions.
  "D107",  # Checks for public __init__ method definitions that are missing docstrings.
  "N803",  # Checks for argument names that do not follow the snake_case convention.
  "RET505",  # Checks for else statements with a return statement in the preceding if block.
  "DTZ",
  "COM812",
  "TD003",
  "FIX002"
]

extend-safe-fixes = [
  "C419",    # unnecessary-comprehension-in-call
  "C420",    # unnecessary-dict-comprehension-for-iterable
  "PLR6201", # literal-membership
  "TC",      # flake8-type-checking
  "UP",      # pyupgrade
]
extend-select = [
  "PLR6201", # literal-membership
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
  "S101",
  "SLF001",
  "N806",  # Checks for the use of non-lowercase variable names in functions.
]

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-args = 6

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
  "error",
]
xfail_strict = true

[tool.coverage.run]
plugins = ["covdefaults"]

[tool.coverage.report]
fail_under = 95
omit = [
  "**/_typing.py",
]
exclude_also = [
  "except ImportError",
]

[tool.mypy]
# ignore_missing_imports = true
disallow_untyped_defs = true
disallow_any_unimported = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
show_error_codes = true
warn_unused_ignores = true

[tool.rumdl]
line-length = 120
flavor = "mkdocs"
include = ["docs/**", "README.md", "AGENTS.md"]
disable = [
  # NOTE: These look like either false positives or unsupported case
  # TODO(FBruzzesi): Report upstream
  # No blank line after admonition block
  "MD031",
  # Use fenced code blocks
  "MD046",
]

[tool.rumdl.MD007]
# Keep list indentation consistent
indent = 4
start-indented = false
