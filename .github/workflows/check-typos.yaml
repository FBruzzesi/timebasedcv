name: Check spelling typos

on:
  workflow_dispatch:
  pull_request:
    branches:
    - main

jobs:

  run-typos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check spelling
        uses: crate-ci/typos@master
        with:
          files: .
